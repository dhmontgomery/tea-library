<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tea Library — QR Code</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f3f9;
      color: #1e1428;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .card {
      background: #fff;
      border: 1.5px solid #ddd6e8;
      border-radius: 16px;
      padding: 2.5rem 3rem;
      text-align: center;
      box-shadow: 0 2px 16px rgba(44,32,23,0.1);
      max-width: 360px;
      width: 100%;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #5b3d8a;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #6e5f82;
      margin-bottom: 1.75rem;
    }

    #qr {
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .url {
      font-size: 0.85rem;
      color: #6e5f82;
      word-break: break-all;
    }

    @media print {
      body { background: #fff; }
      .card { border: none; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Rachael's Tea Library</h1>
    <p class="subtitle">Scan to browse the collection</p>
    <div id="qr"></div>
    <p class="url">tea.montgomerymclain.com</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    new QRCode(document.getElementById('qr'), {
      text: 'https://tea.montgomerymclain.com',
      width: 220,
      height: 220,
      colorDark: '#1e1428',
      colorLight: '#ffffff',
    });
  </script>
</body>
</html>
